  {id:'agility',label:'Agilidade',icon:'⚡',description:'Fuga e ação furtiva'},

].map((x,i)=>({name:x.name,respect:Math.floor(x.initial+x.rate*Math.max(0,s.hours/24)+Math.sin(s.hours/36+i)*350),accent:x.accent}));
const leaderboard=s=>[...rivals(s),{name:s.name,respect:respect(s),isPlayer:true,accent:'#dc5c57'}].sort((a,b)=>b.respect-a.respect);
function newGame({name='Sem Nome',mode='season'}={}){
  const now=Date.now();
  return {version:VERSION,name:name.trim().slice(0,22)||'Sem Nome',mode,startedAt:now,lastSavedAt:now,hours:8,energy:100,health:100,heat:4,cash:2600,bank:0,stats:{strength:12,intelligence:12,agility:12,charisma:12},inventory:{herb:0,pills:0,parts:0},factories:[],crimesWon:0,crimesFailed:0,jailUntil:0,records:[],lastEventDay:1};
}
function log(s,title,description,tone='neutral'){
  s.records=[{id:`${Date.now()}-${Math.floor(roll()*1e7)}`,day:currentDay(s),title,description,tone},...s.records].slice(0,55);
}
function advance(s,additionalHours){
  if(!(additionalHours>0)) return s;
  const next=structuredClone(s);
  const passage=next.mode==='season'?Math.max(0,Math.min(additionalHours,SEASON_HOURS-next.hours)):additionalHours;
  if(!passage)return next;
  next.hours+=passage;
  next.energy=clamp(next.energy+passage*1.8,0,100);
  next.heat=clamp(next.heat-passage*.22,0,100);
  next.health=clamp(next.health+passage*.3,1,100);
  for(const factory of next.factories){
    const spec=FACTORIES.find(f=>f.id===factory.id);
    if(spec)factory.stock=Math.min(factory.count*spec.capacity,factory.stock+passage*spec.perHour*factory.count);
  }
  if(finished(next)&&!finished(s))log(next,'Fim da temporada',`Você encerrou a rodada com ${respect(next).toLocaleString('pt-BR')} de respeito.`,'good');
  return next;
}
function offlineProgress(s,now=Date.now()){
  const previous=Number(s.lastSavedAt)||now;
  const elapsed=Math.max(0,(now-previous)/3600000);
  const next=advance(s,Math.min(elapsed*WORLD_HOURS_PER_REAL_HOUR,24*90));
  const total=next.factories.reduce((x,f)=>x+Math.floor(f.stock),0);
  if(elapsed>=.02&&next.hours>s.hours&&next.factories.length)log(next,'Enquanto você estava fora',`Suas operações continuaram trabalhando. Estoque atual: ${total} unidades.`,'neutral');
  next.lastSavedAt=now;
  return next;
}
function failReason(s,energy=0){
  if(finished(s))return 'A temporada terminou. Continue no infinito ou comece uma nova.';
  if(s.jailUntil>s.hours)return 'Você está preso. Avance o tempo para sair.';
  if(s.health<=0)return 'Você precisa de atendimento médico.';
  if(s.energy<energy)return `Estamina insuficiente (${energy} necessários).`;
  return null;
}
function perform(s,action){
  const next=structuredClone(s);
  const error=(message)=>({state:s,error:message});
  const ok=(value)=>({state:value,error:null});
  const energyCost=action.type==='crime'?CRIMES.find(c=>c.id===action.id)?.energy:action.type==='train'?14:0;
  if(action.type==='crime'||action.type==='train'||action.type==='buy'||action.type==='sell'){
    const bad=failReason(next,energyCost);
    if(bad)return error(bad);
  }
  if(action.type==='crime'){
    const crime=CRIMES.find(c=>c.id===action.id);
    if(!crime)return error('Roubo não encontrado.');
    const chance=crimeChance(next,crime);
    next.energy-=crime.energy;
    const success=roll()*100<chance;
    if(success){
      const earned=round(crime.low+roll()*(crime.high-crime.low));
      next.cash+=earned;next.crimesWon++;
      next.stats[crime.stat]+=roll()<.45?2:1;
      next.heat=clamp(next.heat+crime.heat,0,100);
      log(next,'Golpe bem-sucedido',`${crime.name}: +${formatMoney(earned)}. Chance: ${chance}%.`,'good');
    }else{
      next.crimesFailed++;
      next.heat=clamp(next.heat+crime.heat*1.55,0,100);
      const damage=Math.floor(5+roll()*16);
      next.health=Math.max(1,next.health-damage);
      const arrested=roll()<(0.14+next.heat/200);
      if(arrested){next.jailUntil=next.hours+8;next.cash=Math.max(0,next.cash-100);}
      log(next,arrested?'Preso pela polícia':'O roubo falhou',`${crime.name}: -${damage} de saúde${arrested?', detido por 8 horas':''}. Chance: ${chance}%.`,'bad');
    }
    return ok(advance(next,crime.hours));
  }
  if(action.type==='train'){
    if(!ATTRS.some(x=>x.id===action.id))return error('Atributo inválido.');
    const cost=trainingCost(next,action.id);
    if(next.cash<cost)return error('Dinheiro insuficiente para treinar.');
    next.cash-=cost;next.energy-=14;next.stats[action.id]+=3;
    log(next,'Treinamento concluído',`+3 em ${ATTRS.find(x=>x.id===action.id).label}. Custo: ${formatMoney(cost)}.`,'good');
    return ok(advance(next,2));
  }
  if(action.type==='buy'){
    const spec=FACTORIES.find(x=>x.id===action.id);if(!spec)return error('Negócio desconhecido.');
    if(next.cash<spec.price)return error('Dinheiro insuficiente para comprar.');
    next.cash-=spec.price;
    const existing=next.factories.find(x=>x.id===spec.id);
    if(existing)existing.count++;else next.factories.push({id:spec.id,count:1,stock:0});
    next.heat=clamp(next.heat+spec.heat,0,100);
    log(next,'Novo negócio adquirido',`Você comprou ${spec.name} por ${formatMoney(spec.price)}.`,'good');
    return ok(advance(next,1));
  }
  if(action.type==='sell'){
    const good=action.id;
    if(!GOODS[good])return error('Produto inválido.');
    const total=next.factories.filter(f=>FACTORIES.find(x=>x.id===f.id)?.good===good).reduce((v,f)=>v+Math.floor(f.stock),0);
    if(!total)return error('Sem mercadorias para vender.');
    const price=marketPrice(next,good);
    let sold=0;
    for(const f of next.factories){if(FACTORIES.find(x=>x.id===f.id)?.good===good){const qty=Math.floor(f.stock);f.stock-=qty;sold+=qty;}}
    next.cash+=sold*price;
    next.heat=clamp(next.heat+Math.ceil(sold/24),0,100);
    log(next,'Venda nas docas',`${sold}x ${GOODS[good].name}: +${formatMoney(sold*price)}.`,'good');
    return ok(advance(next,.5));
  }
  if(action.type==='rest'){
    if(finished(next))return error('A temporada terminou.');
    const hours=clamp(Number(action.hours)||8,1,24);
    let updated=advance(next,hours);
    updated.energy=clamp(updated.energy+hours*7,0,100);
    updated.health=clamp(updated.health+hours*1.5,0,100);
    updated.jailUntil=Math.max(updated.jailUntil,updated.hours);
    log(updated,'Descanso',`Você descansou ${hours}h, recuperou energia e a cidade continuou em movimento.`);
    return ok(updated);
  }
  if(action.type==='hospital'){
    const cost=400;
    if(next.cash<cost)return error('Você precisa de $400 para receber atendimento.');
    if(finished(next))return error('A temporada terminou.');
    next.cash-=cost;next.health=100;next.jailUntil=Math.max(next.jailUntil,next.hours);
    log(next,'Alta hospitalar','Saúde recuperada ao máximo por $400.','good');
    return ok(advance(next,3));
  }
  if(action.type==='deposit'||action.type==='withdraw'){
    if(finished(next))return error('A temporada terminou.');
    const amount=Math.floor(Number(action.amount));
    if(!Number.isFinite(amount)||amount<=0)return error('Informe um valor válido.');
    if(action.type==='deposit'){
      if(next.cash<amount)return error('Você não tem esse dinheiro em mãos.');
      next.cash-=amount;next.bank+=amount;
    }else{
      if(next.bank<amount)return error('Saldo bancário insuficiente.');
      next.bank-=amount;next.cash+=amount;
    }
    log(next,action.type==='deposit'?'Depósito realizado':'Saque realizado',formatMoney(amount));
    return ok(next);
  }
  if(action.type==='infinite'){
    if(!finished(next))return error('Conclua a temporada antes de continuar no modo infinito.');
    next.mode='infinite';
    log(next,'Modo infinito desbloqueado','Sua cidade continua após o encerramento da temporada.','good');
    return ok(next);
  }
  return error('Ação desconhecida.');
}
const trainingCost=(s,id)=>Math.round(130+s.stats[id]*22);
function validateSave(raw){
  if(!raw||raw.version!==VERSION||!['season','infinite'].includes(raw.mode))throw new Error('Save incompatível.');
  if(!raw.stats||!ATTRS.every(x=>Number.isFinite(raw.stats[x.id])&&raw.stats[x.id]>=0))throw new Error('Atributos inválidos.');
  if(!Array.isArray(raw.factories)||!raw.factories.every(f=>FACTORIES.some(x=>x.id===f.id)&&Number.isInteger(f.count)&&f.count>=1&&Number.isFinite(f.stock)&&f.stock>=0))throw new Error('Negócios inválidos.');
  if(!Number.isFinite(raw.hours)||raw.hours<0||!Number.isFinite(raw.cash)||raw.cash<0||!Number.isFinite(raw.bank)||raw.bank<0)return false;
  return true;
}

function business(){
const event=marketEvent(game);
return `${header('NEGÓCIOS','Invista em operações clandestinas e venda sua produção nas docas.')}${seasonNotice()}<div class="notice" style="margin-bottom:16px"><div class="notice-icon">⏳</div><div><strong>Produção offline ativada</strong><p>Suas fábricas produzem durante ações, descanso e enquanto você estiver fora. O estoque para ao atingir a capacidade máxima.</p></div></div><div class="grid grid-3">${FACTORIES.map(f=>{const owned=game.factories.find(x=>x.id===f.id),stock=owned?Math.floor(owned.stock):0,cap=owned?f.capacity*owned.count:0;return `<article class="card"><div class="card-top"><div class="card-icon">${GOODS[f.good].icon}</div><span class="tag">${owned?`${owned.count} UNIDADE(S)`:'NÃO ADQUIRIDO'}</span></div><h3>${esc(f.name)}</h3><p>${esc(f.description)}</p><div class="card-stats"><div class="card-stat"><span>PRODUÇÃO</span><strong>${(f.perHour).toFixed(3)}/h</strong></div><div class="card-stat"><span>ESTOQUE</span><strong>${stock} / ${cap||f.capacity}</strong></div><div class="card-stat"><span>PREÇO UN.</span><strong>${money(marketPrice(game,f.good))}</strong></div></div>${owned?progress(cap?stock/cap*100:0,'bar-gold'):''}<div class="card-foot"><span class="card-price"><small>COMPRAR NOVA UNIDADE</small>${money(f.price)}</span><button class="btn btn-primary" data-action="buy" data-id="${f.id}" ${game.cash>=f.price&&!finished(game)&&game.jailUntil<=game.hours?'':'disabled'}>COMPRAR +</button></div></article>`}).join('')}</div><div class="panel gap-top"><div class="panel-head"><h3>⚓ MERCADO DAS DOCAS</h3><span class="panel-caption">PREÇOS ATUAIS</span></div>${Object.keys(GOODS).map(id=>{const good=GOODS[id],qty=game.factories.filter(f=>FACTORIES.find(x=>x.id===f.id)?.good===id).reduce((x,f)=>x+Math.floor(f.stock),0);return `<div class="market-line"><div class="market-goods"><span class="market-symbol">${good.icon}</span><div><strong>${good.name}</strong><p>Estoque: ${qty} unidades</p></div></div><div class="market-right"><div class="market-value">${money(marketPrice(game,id))}<small>por unidade</small></div><button class="btn btn-green btn-small" data-action="sell" data-id="${id}" ${qty&&!finished(game)&&game.jailUntil<=game.hours?'':'disabled'}>VENDER TUDO</button></div></div>`}).join('')}</div><div class="notice gap-top"><div class="notice-icon">🗞️</div><div><strong>${esc(event.title)}</strong><p>${esc(event.body)}</p></div></div>`}
function city(){
return `${header('A CIDADE','Recupere suas forças, gerencie seu dinheiro e acompanhe os acontecimentos.')}${seasonNotice()}<div class="grid grid-2"><div class="panel"><div class="panel-head"><h3>🌙 DESCANSAR</h3><span class="panel-caption">O MUNDO CONTINUA</span></div><div class="panel-pad"><p class="muted" style="font-size:12px;line-height:1.7;margin-bottom:15px">Descansar recupera estamina e saúde, diminui sua exposição policial e faz os negócios produzirem. Mas os rivais também avançam no ranking.</p><div class="grid grid-3">${[4,8,16].map(h=>`<button class="btn btn-dark btn-full" data-action="rest" data-hours="${h}" ${finished(game)?'disabled':''}>${h} HORAS</button>`).join('')}</div><div class="eyebrow" style="margin-top:16px">A CIDADE NÃO DORME</div><p class="muted" style="font-size:11px;line-height:1.7;margin-top:5px">A cada hora real passam 4 horas do jogo. Fechar o navegador não pausa a temporada.</p></div></div><div class="panel"><div class="panel-head"><h3>✚ HOSPITAL</h3><span class="panel-caption">TRATAMENTO</span></div><div class="panel-pad"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow">SUA SAÚDE</span><strong style="font:800 32px 'Barlow Condensed',sans-serif">${Math.floor(game.health)}%</strong></div>${progress(game.health,'bar-red')}<p class="muted" style="font-size:12px;line-height:1.6;margin:15px 0">Tratamento completo, recuperação imediata da saúde e 3 horas de repouso.</p><button class="btn btn-primary btn-full" data-action="hospital" ${game.cash>=400&&!finished(game)?'':'disabled'}>TRATAMENTO · $400 →</button></div></div></div><div class="grid grid-2 gap-top"><div class="panel"><div class="panel-head"><h3>▣ BANCO</h3><span class="panel-caption">GUARDE SEU DINHEIRO</span></div><div class="panel-pad"><div class="grid grid-2"><div><div class="eyebrow">EM MÃOS</div><h3 style="font-size:33px;margin-top:5px">${money(game.cash)}</h3></div><div><div class="eyebrow">NO BANCO</div><h3 style="font-size:33px;margin-top:5px">${money(game.bank)}</h3></div></div><div class="control-row gap-top"><input id="bankAmount" class="field" type="number" min="1" step="1" placeholder="Valor" style="width:130px;flex:1" /><button class="btn btn-dark" data-bank="deposit">DEPOSITAR</button><button class="btn btn-dark" data-bank="withdraw">SACAR</button></div><p class="muted" style="font-size:11px;margin-top:12px">Dinheiro depositado fica protegido de multas de prisão.</p></div></div><div class="panel"><div class="panel-head"><h3>🗞️ CRIMCITY TIMES</h3><span class="panel-caption">EDIÇÃO DO DIA ${currentDay(game)}</span></div><div class="panel-pad"><div class="page-label">NOTÍCIAS DE ÚLTIMA HORA</div><h3 style="font-size:27px;line-height:1.1">${esc(marketEvent(game).title)}</h3><p class="muted" style="font-size:12px;line-height:1.7;margin-top:10px">${esc(marketEvent(game).body)}</p><div class="tag" style="display:inline-block;margin-top:14px">NOVA EDIÇÃO A CADA 3 DIAS</div></div></div></div>`
}
function ranking(){const rank=leaderboard(game);return `${header('RANKING','Dispute o topo contra três rivais controlados pela simulação.')}${seasonNotice()}<div class="grid grid-2"><div class="panel"><div class="panel-head"><h3>♛ OS MAIS RESPEITADOS</h3><span class="panel-caption">${game.mode==='season'?`TEMPORADA 01 · DIA ${currentDay(game)}`:'MODO INFINITO'}</span></div>${rank.map((x,i)=>`<div class="rank-line ${x.isPlayer?'self':''}"><span class="rank-num">${String(i+1).padStart(2,'0')}</span><div class="rank-avatar" style="color:${x.accent}">${esc(x.name.charAt(0).toUpperCase())}</div><div class="rank-name">${esc(x.name)}${x.isPlayer?'<small>VOCÊ</small>':'<small>RIVAL SIMULADO</small>'}</div><div class="rank-score">${unit(x.respect)}</div></div>`).join('')}</div><div class="panel"><div class="panel-head"><h3>✦ SEU IMPÉRIO</h3><span class="panel-caption">COMPOSIÇÃO DO RESPEITO</span></div><div class="panel-pad"><div class="stat-list">${[['Atributos',unit(statsPower(game)*11)],['Dinheiro + patrimônio',unit((game.cash+game.bank+assetsValue(game)+Object.keys(GOODS).reduce((n,k)=>n+(game.inventory[k]||0)*GOODS[k].base,0))*.15)],['Roubos bem-sucedidos',unit(game.crimesWon*24)]].map(([k,v])=>`<div class="stat-line"><strong>${k}</strong><span>${v}</span></div>`).join('')}</div><div class="notice gap-top"><div class="notice-icon">📈</div><div><strong>O respeito decide a temporada</strong><p>Dinheiro, negócios e habilidades contam para o ranking. Os rivais acumulam respeito conforme os dias avançam.</p></div></div><div class="eyebrow" style="margin-top:16px">ESTATÍSTICAS</div><p class="muted" style="font-size:12px;line-height:2;margin-top:5px">Roubos realizados: ${game.crimesWon+game.crimesFailed}<br>Golpes bem-sucedidos: ${game.crimesWon}<br>Empreendimentos: ${game.factories.reduce((n,f)=>n+f.count,0)}<br>Patrimônio fixo: ${money(assetsValue(game))}</p></div></div></div>`}
function content(){return {dashboard,crimes,training,business,city,ranking}[tab]?.()||dashboard()}
function render(){if(game)shell();else landing()}
root.addEventListener('click',e=>{
const target=e.target.closest('[data-tab],[data-mode],[data-action],[data-bank],[data-export],[data-import],[data-reset]');if(!target)return;
if(target.dataset.tab){tab=target.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'});return}
if(target.dataset.mode){newMode=target.dataset.mode;const name=document.getElementById('name')?.value||'Corvo';render();document.getElementById('name').value=name;return}
if(target.dataset.action){apply({type:target.dataset.action,id:target.dataset.id,hours:Number(target.dataset.hours)});return}
if(target.dataset.bank){const amount=Number(document.getElementById('bankAmount')?.value);apply({type:target.dataset.bank,amount});return}
if(target.hasAttribute('data-export')){const a=document.createElement('a');const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=`cidade-sem-lei-dia-${currentDay(game)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Save exportado.');return}
if(target.hasAttribute('data-import')){document.getElementById('importFile')?.click();return}
if(target.hasAttribute('data-reset')){if(confirm('Iniciar nova partida? O progresso atual será substituído. Exporte o save antes se quiser guardá-lo.')){game=null;localStorage.removeItem(KEY);tab='dashboard';render()}return}
});
root.addEventListener('submit',e=>{if(e.target.id==='start-form'){e.preventDefault();game=newGame({name:document.getElementById('name').value,mode:newMode});save();render();toast('Bem-vindo à Cidade Sem Lei.');}});
root.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!validateSave(data))throw new Error('O save contém valores inválidos.');if(!confirm('Importar este save e substituir sua partida atual?'))return;game=offlineProgress(data);save();render();toast('Save importado.')}catch(err){toast('Falha na importação: '+err.message,true)}});
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&game){game=offlineProgress(game);save();render()}});
setInterval(()=>{if(game){game=offlineProgress(game);save();render()}},20000);
render();

</script></body></html>
